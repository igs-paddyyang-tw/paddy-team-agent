# paddy-team-agent 配置
# 啟動：python start.py
# ark-team-agent v1.0.1

defaults:
  backend: kiro-cli
  model: auto

channel:
  bot_token_env: TELEGRAM_BOT_TOKEN

access:
  mode: locked
  allowed_users:
    - 937896656                      # paddyyang

cost_guard:
  daily_limit_usd: 30.0
  warn_at_percentage: 80
  timezone: Asia/Taipei

hang_detector:
  enabled: true
  timeout_minutes: 60
  escalation_minutes: 180

instances:
  admin-agent:
    working_directory: agents/admin-agent
    description: "👑 Admin — 服務管理、開發維護、團隊指揮"
    private_chat: 937896656
    role: admin

  leader-agent:
    working_directory: agents/leader-agent
    description: "🧠 Leader — 需求分析、派工、驗收"
    role: leader

  ai-dev-agent:
    working_directory: agents/ai-dev-agent
    description: "🤖 AI Dev — AI/ML 架構、Prompt 工程、Agent 設計"
    role: worker

  coder-agent:
    working_directory: agents/coder-agent
    description: "💻 Coder — 全端開發、API 實作、程式碼產出"
    role: worker

  qa-agent:
    working_directory: agents/qa-agent
    description: "🧪 QA — 測試、品質保證、Code Review"
    role: worker

health_port: 33333
