[project]
name = "paddy-team-agent"
version = "1.1.0"
description = "Paddy 個人 AI Team Agent（基於 ark-team-agent 套件）"
requires-python = ">=3.11"
dependencies = [
    "ark-team-agent>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
